[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "routeforge"
version = "0.1.0"
description = "MoE Routing ABI and replay runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RouteForge contributors" }]
dependencies = [
  "typing-extensions>=4.8",
]

[project.optional-dependencies]
storage = ["safetensors>=0.4"]
hf = ["transformers>=4.52", "torch>=2.1"]
torch = ["torch>=2.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["routeforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
